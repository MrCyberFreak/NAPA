[project]
name = "napa-13077"
version = "0.1.0"
description = "Scrape -> archive -> parse -> SQLite -> views pipeline for NAPA pool division 13077"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["src*"]
