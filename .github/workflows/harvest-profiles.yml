name: harvest-profiles

# Profile harvest (densification pass). Captures RIVALS / H2H / TRENDS / MAIN per
# roster player into data/raw/profiles/<id>/, optionally drilling each rival for
# per-game lifetime H2H. Resumable (skips already-fetched), slow + fail-soft for
# the rate-limit-prone host. Not urgent — run manually, re-run to continue.

on:
  workflow_dispatch:
    inputs:
      did:
        description: "Division id whose roster to harvest"
        default: "13077"
      tabs:
        description: "Tabs to harvest (comma)"
        default: "rivals,h2h,trends,main"
      drill:
        description: "Drill each rival for per-game H2H (1) or tabs only (0)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: harvest-profiles
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps + Chromium
        run: |
          pip install -r requirements.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Harvest profiles
        run: python -m src.browser_fetch --harvest --did "${{ inputs.did }}" --harvest-tabs "${{ inputs.tabs }}" --harvest-drill "${{ inputs.drill }}"
      - name: Commit profiles
        if: always()        # commit whatever was captured even if the step times out
        run: |
          git config user.name  "napa-archive-bot"
          git config user.email "napa-archive-bot@users.noreply.github.com"
          git add -A data/raw/profiles
          if git diff --cached --quiet; then
            echo "No new profile pages."
          else
            git commit -m "chore(harvest): profile pages [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin ${{ github.ref_name }} \
                && git push origin HEAD:${{ github.ref_name }} && break
              echo "push race, retry $i"; sleep 5
            done
          fi
