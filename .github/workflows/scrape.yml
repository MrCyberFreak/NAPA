name: scrape-archive

# Cloud-first automation for the NAPA raw archive.
# - ONE daily run (~09:00 MT). It SCRAPES every active division (rosters /
#   standings / schedules) so all roster/skill/standings changes show up in the
#   committed daily diff, and auto-BACKFILLS score sheets only for the divisions
#   whose league night was YESTERDAY (config.divisions_due) + the catch-up queue
#   — an all-division score-sheet walk is the sustained load that escalates the
#   host bot-challenge into aborts, so backfill stays day-after-play.
# - A persistent catch-up queue (data/raw/_catchup.json) carries forward any
#   piece that slipped through — a division skipped by a host-wide bot-challenge
#   abort, or a makeup played off-schedule — and folds it into the next run ON
#   TOP of that day's due set, so nothing is dropped just because its division
#   didn't play last night.
# - Host-agnostic, config-driven fetcher; a connectivity probe logs each host's
#   reachability FROM THE RUNNER.
# - Fail-soft: the fetcher logs and STOPS on error (never retry-hammers); a
#   heartbeat file makes a missed/failed run visible.
# - The scraped archive (+ the catch-up queue) is committed back as the record.
#
# Cron is UTC and not DST-aware. Division time zone is America/Denver. 15:00 UTC
# is 09:00 MDT / 08:00 MST — both the morning AFTER the league night, and both
# the same calendar date as UTC, so "yesterday's league night" is unambiguous
# (the run reckons the due set in America/Denver regardless).

on:
  schedule:
    - cron: "0 15 * * *"   # daily ~09:00 MT — day-after-play capture + backfill
  workflow_dispatch:
    inputs:
      probe_only:
        description: "Only run the host-reachability probe (no fetch/commit)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape-archive
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Connectivity probe (host reachability from the runner)
        run: |
          echo "## Host reachability ($(date -u +%FT%TZ))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m src.fetch --probe-only --root data/raw | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Plain GETs can't pass the hosts' "One moment..." JS challenge, so the
      # real capture uses a headless browser that executes the page's JS.
      - name: Install Playwright Chromium
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.probe_only == false }}
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium

      # Day-after-play: scrape + auto-backfill the divisions that played
      # yesterday plus the catch-up carryover, then re-derive the queue. The
      # run reckons "yesterday" in America/Denver itself; --date is only for
      # backfilled/manual runs.
      - name: Scheduled scrape (all-divisions daily + day-after-play backfill)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.probe_only == false }}
        run: python -m src.browser_fetch --scheduled --all-divisions

      # Surface what the daily states.php discovery found: active rollovers (now
      # auto-scraped), rolled predecessors (kept for makeups), and NEW LEAGUES
      # that need a human to onboard them. Reads the committed overlay/parsed
      # files; a no-op when discovery was skipped (host challenge).
      - name: Discovery summary (rollovers / new leagues)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.probe_only == false }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          print("## Season-rollover discovery")
          try:
              reg = json.load(open("data/raw/_registry.json"))
          except OSError:
              reg = {}
          disc, unk = reg.get("discovered", {}), reg.get("unknown", {})
          active = {d: e for d, e in disc.items() if e.get("status") == "active"}
          rolled = {d: e for d, e in disc.items() if e.get("status") == "rolled"}
          parsed = sorted(glob.glob("data/raw/_states/*/parsed.json"))
          if parsed:
              try:
                  print(f"- states.php: **{len(json.load(open(parsed[-1])))}** NoCo "
                        f"divisions seen ({parsed[-1].split('/')[-2]})")
              except OSError:
                  pass
          for label, block in (("Active rollovers (now scraped)", active),
                               ("Rolled predecessors (kept for makeups)", rolled)):
              if block:
                  print(f"\n**{label}:**")
                  for d, e in sorted(block.items(), key=lambda kv: int(kv[0])):
                      tail = (f"was {e.get('predecessor')}" if e.get("status") == "active"
                              else f"-> {e.get('successor')}")
                      print(f"- `{d}` {e.get('slug')} ({tail})")
          if unk:
              print("\n**NEW LEAGUES — onboard via napa-onboard-division:**")
              for d, e in sorted(unk.items(), key=lambda kv: int(kv[0])):
                  print(f"- `{d}` \"{e.get('name')}\" {e.get('slug')}")
          if not (active or rolled or unk):
              print("\n_No rollovers or new leagues detected._")
          PY

      # Runs even if the scrape step was cancelled (90-min timeout) or errored, so
      # a long/partial run still ARCHIVES whatever it captured instead of throwing
      # it all away — each run then makes committed progress and the catch-up queue
      # drains. write-on-change means a no-op if nothing new landed.
      - name: Commit archive back
        if: ${{ always() }}
        run: |
          git config user.name  "napa-archive-bot"
          git config user.email "napa-archive-bot@users.noreply.github.com"
          git add -A data/raw
          if git diff --cached --quiet; then
            echo "No archive changes to commit (write-on-change: nothing new)."
          else
            git commit -m "chore(archive): scrape $(date -u +%F) [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin ${{ github.ref_name }} \
                && git push origin HEAD:${{ github.ref_name }} && break
              echo "push race, retry $i"; sleep 5
            done
          fi
